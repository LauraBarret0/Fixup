<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F6F1" />
    <title>FIX UP – Mais rápido possível</title>
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="screen">
        <header class="head">
          <a class="back" id="back" href="../index.html" aria-label="Voltar"
            ><svg class="i thick"><use href="#i-back" /></svg
          ></a>
          <div class="t">
            <h1>Mais rápido possível</h1>
            <div class="sub" id="hjSub"></div>
          </div>
        </header>
        <div class="body">
          <div class="tag violet" id="hjWomen" style="align-self: flex-start">
            <svg class="i s16 thick"><use href="#i-user" /></svg>Preferência:
            profissional mulher
          </div>
          <div class="req-card">
            <div class="ic">
              <svg class="i s18"><use href="#i-bolt" /></svg>
            </div>
            <div style="min-width: 0">
              <b id="rcTitle"></b
              ><span class="hint">Valor do serviço: <span id="rcPrice"></span></span>
            </div>
          </div>
          <div class="card steps" id="hjSteps" aria-live="polite"></div>
          <div class="match" id="hjMatch" hidden>
            <div class="top">
              <div class="avatar xl" id="hjAv"></div>
              <div style="flex: 1; min-width: 0">
                <b id="hjName"></b>
                <div class="m">
                  <svg class="i s16 star"><use href="#i-star" /></svg
                  ><span id="hjMeta"></span>
                </div>
              </div>
            </div>
            <div class="eta">
              <svg class="i s18"><use href="#i-clock" /></svg
              ><span id="hjEta"></span>
            </div>
            <a class="btn" href="perfil.html"
              >Ver perfil e portfólio<svg class="i s18 thick">
                <use href="#i-next" /></svg
            ></a>
          </div>
        </div>
        <div class="foot tight">
          <a
            class="btn primary"
            id="hjPay"
            href="pagamento.html"
            aria-disabled="true"
            >Confirmar e pagar</a
          >
          <button class="btn ghost" id="hjOther" disabled>
            Buscar outro profissional
          </button>
        </div>
      </main>
    </div>
    <script src="../js/fixup.js"></script>
    <script>
      const S = FX.state,
        { $ } = FX;
      S.mode = "hoje";
      FX.back(S.service + ".html");
      const pool = FX.PROS.filter((p) => !S.women || p.f).sort(
        (a, b) => a.km - b.km,
      );
      $("#hjSub").textContent = `${FX.svc().label} · hoje`;
      $("#hjWomen").hidden = !S.women;
      $("#rcTitle").textContent = FX.summaryLine();
      $("#rcPrice").textContent = FX.brl(FX.price());
      let timers = [],
        accepted = false;
      const later = (f, ms) => timers.push(setTimeout(f, ms));
      function start() {
        timers.forEach(clearTimeout);
        timers = [];
        accepted = false;
        S.pro = pool[S.rushIdx % pool.length].id;
        FX.save();
        const p = FX.pro(),
          media = S.media.img + S.media.vid ? " com fotos e vídeo" : "";
        $("#hjMatch").hidden = true;
        $("#hjPay").setAttribute("aria-disabled", "true");
        $("#hjOther").disabled = true;
        const draw = (st) => {
          $("#hjSteps").innerHTML = [
            ["done", `Pedido enviado${media}`],
            [
              st >= 1 ? "done" : "now seeking",
              "Profissionais próximos avisados",
            ],
            [
              st >= 2 ? "now" : st === 1 ? "now seeking" : "wait",
              st >= 2
                ? `${p.name.split(" ")[0]} aceitou o seu pedido`
                : "Aguardando alguém aceitar",
            ],
            ["wait", "A caminho"],
          ]
            .map(
              ([c, t]) =>
                `<div class="step ${c}"><div class="dot">${FX.icon("check")}</div><div>${t}</div></div>`,
            )
            .join("");
        };
        draw(0);
        later(() => draw(1), 900);
        later(() => {
          draw(2);
          accepted = true;
          $("#hjAv").textContent = p.ini;
          $("#hjName").textContent = p.name;
          $("#hjMeta").textContent =
            `${FX.rate(p.rating)} · Identidade verificada`;
          $("#hjEta").textContent =
            `Chega hoje por volta de ${FX.eta(p)} · ${FX.km(p.km)} km`;
          $("#hjMatch").hidden = false;
          $("#hjPay").setAttribute("aria-disabled", "false");
          $("#hjOther").disabled = false;
        }, 2400);
      }
      $("#hjPay").addEventListener("click", (e) => {
        if (!accepted) e.preventDefault();
        else FX.save();
      });
      $("#hjOther").onclick = () => {
        S.rushIdx++;
        start();
      };
      start();
    </script>
  </body>
</html>
