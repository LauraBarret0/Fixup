<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F6F1" />
    <title>FIX UP – Checklist de retirada</title>
    <link rel="shortcut icon" href="../image/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="screen">
        <header class="head">
          <a class="back" id="back" href="ferramentas.html" aria-label="Voltar"
            ><svg class="i thick"><use href="#i-back" /></svg
          ></a>
          <div class="t">
            <h1>Checklist de retirada</h1>
            <div class="sub" id="ckSub"></div>
          </div>
        </header>
        <div class="body" style="gap: 16px">
          <div class="stepper" aria-label="Etapas do aluguel">
            <span class="on">Retirada</span><i></i><span>Uso</span><i></i
            ><span>Devolução</span>
          </div>
          <div class="sec">
            <div class="sec-h">
              <div class="sec-t">1. Fotos do estado</div>
              <div class="hint" id="ckCount"></div>
            </div>
            <div class="shots" id="shots"></div>
          </div>
          <div class="sec">
            <div class="sec-t">2. Confira com o dono</div>
            <div class="sec" id="ckItems"></div>
          </div>
          <div class="note">
            <svg class="i s22"><use href="#i-shield" /></svg>
            <div>
              As fotos ficam salvas e são comparadas com as da devolução.
            </div>
          </div>
        </div>
        <div class="foot" style="gap: 8px">
          <button class="btn primary" id="ckConfirm">Confirmar retirada</button>
          <div class="hint center" id="ckDeposit"></div>
        </div>
      </main>
    </div>
    <script src="../js/fixup.js"></script>
    <script>
      const S = FX.state,
        { $ } = FX,
        t = FX.tool(),
        k = FX.KITS[t.kit];
      $("#ckSub").textContent = `${t.name} · ${t.owner}`;
      
      const shots = k.shots.map(() => true),
        checks = k.checks.map(() => true);
      function render() {
        $("#shots").innerHTML = k.shots
          .map(
            (l, i) =>
              `<button class="shot" data-shot="${i}" aria-pressed="${shots[i]}">${FX.icon("camera", "s22")}${l}</button>`,
          )
          .join("");
        $("#ckItems").innerHTML = k.checks
          .map(
            (c, i) =>
              `<label class="check"><input type="checkbox" data-chk="${i}" ${checks[i] ? "checked" : ""}>${c}</label>`,
          )
          .join("");
        const n = shots.filter(Boolean).length;
        $("#ckCount").textContent = `${n} de ${k.shots.length}`;
        $("#ckConfirm").disabled = !(
          n === k.shots.length && checks.every(Boolean)
        );
      }
      $("#shots").onclick = (e) => {
        const b = e.target.closest("[data-shot]");
        if (b) {
          shots[+b.dataset.shot] = !shots[+b.dataset.shot];
          render();
        }
      };
      $("#ckItems").onchange = (e) => {
        const c = e.target.closest("[data-chk]");
        if (c) {
          checks[+c.dataset.chk] = c.checked;
          render();
        }
      };
      $("#ckConfirm").onclick = () => {
        S.orders.unshift({
          icon: t.icon,
          title: t.name,
          sub: `Aluguel · ${t.owner} · R$ ${t.price} por dia`,
          st: "Em uso",
        });
        S.last = {
          title: "Retirada confirmada",
          text: `As fotos de ${t.name.toLowerCase()} foram salvas. `,
        };
        FX.save();
        location.href = "confirmado.html";
      };
      render();
    </script>
  </body>
</html>
