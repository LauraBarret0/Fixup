<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F6F1" />
  <title>FIX UP – Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="app">
    <main class="screen">
      <div class="body" style="gap: 16px; padding-top: 20px">
        <h1 class="h1">Perfil</h1>

        <div class="ph">
          <div class="avatar lg" id="cAv">MA</div>
          <div>
            <h2 id="cName">Mariana</h2>
            <div class="role">São Paulo, SP</div>
            <div class="stars" id="cStars"></div>
          </div>
        </div>

        <div class="menu">
          <button data-soon>
            <svg class="i">
              <use href="#i-pin" />
            </svg><span>Meus endereços</span><svg class="i s18">
              <use href="#i-next" />
            </svg>
          </button>
          <button data-soon>
            <svg class="i">
              <use href="#i-card" />
            </svg><span>Formas de pagamento</span><svg class="i s18">
              <use href="#i-next" />
            </svg>
          </button>
          <button data-soon>
            <svg class="i">
              <use href="#i-help" />
            </svg><span>Ajuda</span><svg class="i s18">
              <use href="#i-next" />
            </svg>
          </button>
        </div>
      </div>
      <nav class="tabbar"></nav>
    </main>
  </div>
  <script src="../js/fixup.js"></script>
  <script>
    FX.tabbar("conta");
    const c = FX.CLIENT, star = FX.icon('star');
    document.getElementById('cAv').textContent = c.ini;
    document.getElementById('cName').textContent = c.name;
    document.getElementById('cStars').innerHTML =
      `<span class="stars-row" role="img" aria-label="Nota ${FX.rate(c.rating)} de 5">${star.repeat(5)}<span class="stars-fill" style="width:${c.rating / 5 * 100}%">${star.repeat(5)}</span></span><b>${FX.rate(c.rating)}</b>`;
  </script>
</body>

</html>
