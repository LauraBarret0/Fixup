<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F6F1" />
    <title>FIX UP – Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

          </div>
          <div class="menu">
            <button data-soon>
              <svg class="i"><use href="#i-pin" /></svg

              ><svg class="i s18"><use href="#i-next" /></svg>
            </button>
            <button data-soon>
              <svg class="i"><use href="#i-card" /></svg

              ><svg class="i s18"><use href="#i-next" /></svg>
            </button>
            <button data-soon>
              <svg class="i"><use href="#i-help" /></svg><span>Ajuda</span
              ><svg class="i s18"><use href="#i-next" /></svg>
            </button>

        </div>
        <nav class="tabbar"></nav>

    </div>
    <script src="../js/fixup.js"></script>
    <script>
      FX.tabbar("conta");
