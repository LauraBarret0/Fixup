<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F6F1" />
  <title>FIX UP – Chat</title>
  <link rel="shortcut icon" href="../image/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .chat-head .avatar {
      width: 44px;
      height: 44px;
      font-size: 15px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--green-ink);
    }

    .online::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--leaf);
    }

    .safe {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 20px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--mint);
      color: var(--mint-ink);
      font-size: 12px;
      line-height: 1.4;
    }

    .safe .i {
      color: var(--green);
      margin-top: 1px;
    }

    .msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 20px;
    }

    .day-label {
      align-self: center;
      font-size: 12px;
      color: var(--muted);
      padding: 2px 10px;
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      animation: rise 0.2s ease both;
    }

    .bubble time {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
    }

    .bubble.them {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .bubble.me {
      align-self: flex-end;
      background: var(--deep);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .bubble.me time {
      text-align: right;
    }

    .bubble img,
    .bubble video {
      display: block;
      max-width: 100%;
      width: 220px;
      border-radius: 12px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line-strong);
      animation: blink 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes blink {
      50% {
        opacity: 0.25;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .typing span,
      .bubble {
        animation: none;
      }
    }

    .quick {
      flex: none;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 20px 10px;
    }

    .quick button {
      flex: none;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 500;
    }

    .composer {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 20px;
      background: var(--bg);
      border-top: 1px solid var(--line);
    }

    .composer .sq {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-width: 1px;
      border-color: var(--line);
      color: var(--deep);
    }

    .composer input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 14px;
    }

    .composer .send {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--deep);
      color: #fff;
      display: grid;
      place-items: center;
    }

    .composer .send[disabled] {
      background: var(--line);
      color: var(--disabled);
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="screen">
      <header class="head chat-head">
        <a class="back" id="back" href="perfil.html" aria-label="Voltar"><svg class="i thick">
            <use href="#i-back" />
          </svg></a>
        <div class="avatar" id="avatar"></div>
        <div class="t">
          <h1 id="name"></h1>
          <div class="online" id="status">Online agora</div>
        </div>
      </header>

      <div class="safe">
        <svg class="i s16">
          <use href="#i-lock" />
        </svg>Combine tudo por aqui.
        O pagamento só é liberado quando você confirma o serviço.
      </div>

      <div class="msgs" id="msgs" aria-live="polite" aria-label="Mensagens"></div>

      <div class="quick" id="quick"></div>

      <form class="composer" id="form" autocomplete="off">
        <button type="button" class="sq" id="attach" aria-label="Enviar foto ou vídeo">
          <svg class="i">
            <use href="#i-camera" />
          </svg>
        </button>
        <input type="file" id="file" accept="image/*,video/*" hidden />
        <input type="text" id="text" placeholder="Escreva uma mensagem" aria-label="Mensagem" maxlength="500" />
        <button type="submit" class="send" id="send" aria-label="Enviar" disabled>
          <svg class="i thick">
            <use href="#i-next" />
          </svg>
        </button>
      </form>
    </main>
  </div>
  <script src="../js/fixup.js"></script>
  <script>
    const S = FX.state,
      { $ } = FX;
    const pro = FX.pro();
    FX.back(S.mode === "hoje" ? "hoje.html" : "perfil.html");
    FX.setAvatar($('#avatar'), pro);
    $("#name").textContent = pro.name;
    $("#status").textContent = "Online agora · " + FX.proRole(pro);

    /* Conversa guardada por profissional (as fotos enviadas não são guardadas) */
    S.chat = S.chat || {};
    const log = (S.chat[pro.id] = S.chat[pro.id] || []);
    const hhmm = (d = new Date()) =>
      String(d.getHours()).padStart(2, "0") +
      ":" +
      String(d.getMinutes()).padStart(2, "0");

    function bubble(m) {
      const el = document.createElement("div");
      el.className = "bubble " + (m.me ? "me" : "them");
      if (m.media) {
        const x = document.createElement(
          m.media.type === "video" ? "video" : "img",
        );
        x.src = m.media.url;
        if (m.media.type === "video") {
          x.controls = true;
          x.muted = true;
        } else x.alt = "Foto enviada";
        el.append(x);
      }
      if (m.t) el.append(document.createTextNode(m.t));
      const t = document.createElement("time");
      t.textContent = m.h;
      el.append(t);
      $("#msgs").append(el);
      $("#msgs").scrollTop = $("#msgs").scrollHeight;
    }
    function add(m) {
      m.h = hhmm();
      log.push(
        m.media
          ? {
            me: m.me,
            t: m.t || "",
            h: m.h,
            media: null,
            mediaLabel: m.media.type,
          }
          : m,
      );
      bubble(m);
      FX.save();
    }

    /* Respostas simuladas do profissional */
    function reply(text, hasMedia) {
      const q = text.toLowerCase();
      if (hasMedia || /foto|vídeo|video|imagem/.test(q)) return 'Recebi! Dá para ver bem o problema.';
      if (/hor[aá]rio|hora|quando|chega|demora/.test(q))
        return `Posso ${FX.whenText()}. Já deixei reservado para você.`;
      if (/pre[cç]o|valor|or[cç]amento|quanto|custa|desconto/.test(q)) return 'O valor do serviço já está fechado no app, então por aqui eu cuido só dos detalhes do atendimento.';
      if (/pronto|preparar|antes|deixar|acesso/.test(q)) return 'Se puder, deixe o local livre para eu trabalhar e o acesso liberado (quadro de luz, registro ou parede a ser pintada).';
      if (/material|pe[cç]a|tinta|massa|compro|levar/.test(q)) return FX.state.service === 'pintura'
        ? 'Levo os pincéis e as minhas ferramentas. Tinta, massa e o restante do material ficam por sua conta.'
        : 'Levo as minhas ferramentas. O material que o serviço precisar fica por sua conta.';
      if (/obrigad|valeu|ok|combinado/.test(q))
        return "Combinado! Qualquer coisa é só chamar por aqui.";
      return "Entendi! Pode me dar mais um detalhe sobre o local?";
    }
    let typingEl = null;
    function answer(text, hasMedia) {
      typingEl = document.createElement("div");
      typingEl.className = "bubble them typing";
      typingEl.setAttribute("aria-label", "Digitando");
      typingEl.innerHTML = "<span></span><span></span><span></span>";
      $("#msgs").append(typingEl);
      $("#msgs").scrollTop = $("#msgs").scrollHeight;
      setTimeout(() => {
        typingEl.remove();
        add({ me: false, t: reply(text, hasMedia) });
      }, 1100);
    }
    function send(text, media) {
      if (!text && !media) return;
      add({ me: true, t: text, media });
      answer(text, !!media);
    }

    /* Início da conversa */
    $("#msgs").insertAdjacentHTML(
      "beforeend",
      '<div class="day-label">Hoje · dados ilustrativos do protótipo</div>',
    );
    if (!log.length) {
      const first = `Oi, Mariana! Vi o seu pedido: ${FX.summaryLine()}. Pode me mandar uma foto do local?`;
      log.push({ me: false, t: first, h: hhmm() });
      FX.save();
    }
    log.forEach((m) =>
      bubble(
        m.mediaLabel
          ? {
            me: m.me,
            t:
              m.t ||
              (m.mediaLabel === "video"
                ? "🎥 Vídeo enviado"
                : "📷 Foto enviada"),
            h: m.h,
          }
          : m,
      ),
    );

    /* Respostas rápidas */
    const quick = ['Posso enviar fotos?', 'Qual o horário?', 'O que preciso deixar pronto?', 'Preciso comprar algo?'];
    $("#quick").innerHTML = quick
      .map((q) => `<button type="button">${q}</button>`)
      .join("");
    $("#quick").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) send(b.textContent);
    });

    /* Compositor */
    const input = $("#text");
    input.addEventListener("input", () => {
      $("#send").disabled = !input.value.trim();
    });
    $("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = "";
      $("#send").disabled = true;
      send(t);
    });
    $("#attach").onclick = () => $("#file").click();
    $("#file").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      send("", {
        type: f.type.startsWith("video") ? "video" : "image",
        url: URL.createObjectURL(f),
      });
      e.target.value = "";
    });
  </script>
</body>

</html>
