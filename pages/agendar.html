<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F6F1" />
    <title>FIX UP – Dia e horário</title>
    <link rel="shortcut icon" href="image/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="screen">
        <header class="head">
          <a class="back" id="back" href="../index.html" aria-label="Voltar"
            ><svg class="i thick"><use href="#i-back" /></svg
          ></a>
          <div class="t">
            <h1>Dia e horário</h1>
            <div class="sub">Passo 2 de 3</div>
          </div>
        </header>
        <div class="body">
          <div class="chips" id="agTags"></div>
          <div class="card cal">
            <div class="cal-h">
              <button class="cal-nav" id="calPrev" aria-label="Mês anterior">
                <svg class="i thick"><use href="#i-back" /></svg>
              </button>
              <b id="calTitle"></b>
              <button class="cal-nav" id="calNext" aria-label="Próximo mês">
                <svg class="i thick"><use href="#i-next" /></svg>
              </button>
            </div>
            <div class="dow" aria-hidden="true">
              <div>D</div>
              <div>S</div>
              <div>T</div>
              <div>Q</div>
              <div>Q</div>
              <div>S</div>
              <div>S</div>
            </div>
            <div class="days" id="days"></div>
          </div>
          <div class="sec">
            <div class="sec-t">Horário</div>
            <div class="slots" id="slots"></div>
          </div>
        </div>
        <div class="foot">
          <div class="summary">
            <svg class="i s18 thick"><use href="#i-clock" /></svg
            ><span id="agSummary"></span>
          </div>
          <a class="btn primary" href="profissionais.html"
            >Ver profissionais disponíveis<svg class="i s18 thick">
              <use href="#i-next" /></svg
          ></a>
        </div>
      </main>
    </div>
    <script src="../js/fixup.js"></script>
    <script>
      const S = FX.state,
        { $, $$ } = FX;
      S.mode = "agendado";
      FX.back(S.service + ".html");
      let view = { y: S.date.y, m: S.date.m };
      const same = (a, b) => a.y === b.y && a.m === b.m && a.d === b.d;
      const t0 = {
        y: FX.today0.getFullYear(),
        m: FX.today0.getMonth(),
        d: FX.today0.getDate(),
      };
      function slotOk(t) {
        if (!same(S.date, t0)) return true;
        const [h, mi] = t.split(":").map(Number);
        return (
          new Date(S.date.y, S.date.m, S.date.d, h, mi) >
          new Date(Date.now() + 3600000)
        );
      }
      function render() {
        $("#agTags").innerHTML =
          `<span class="tag">${FX.svc().label}</span>` +
          (S.women
            ? '<span class="tag violet">Só profissionais mulheres</span>'
            : "");
        const { y, m } = view,
          isCur = y === t0.y && m === t0.m;
        $("#calTitle").textContent = `${FX.MONTHS[m]} ${y}`;
        $("#calPrev").disabled = isCur;
        $("#calNext").disabled = (y - t0.y) * 12 + m - t0.m >= 3;
        const first = new Date(y, m, 1).getDay(),
          total = new Date(y, m + 1, 0).getDate();
        let h = "<span></span>".repeat(first);
        for (let d = 1; d <= total; d++) {
          const past = new Date(y, m, d) < FX.today0,
            isT = isCur && d === t0.d,
            sel = same(S.date, { y, m, d });
          h += `<button class="day${isT ? " today" : ""}" data-d="${d}" ${past ? "disabled" : ""} aria-pressed="${sel}" aria-label="${d} de ${FX.MONTHS[m]}${isT ? ", hoje" : ""}">${d}</button>`;
        }
        $("#days").innerHTML = h;
        if (!slotOk(S.time)) S.time = FX.TIMES.find(slotOk) || S.time;
        $("#slots").innerHTML = FX.TIMES.map(
          (t) =>
            `<button class="slot" data-t="${t}" ${slotOk(t) ? "" : "disabled"} aria-pressed="${t === S.time}">${t}</button>`,
        ).join("");
        $("#agSummary").textContent =
          FX.whenText() + ". Só aparece quem está livre nesse horário.";
        FX.save();
      }
      $("#calPrev").onclick = () => {
        view.m--;
        if (view.m < 0) {
          view.m = 11;
          view.y--;
        }
        render();
      };
      $("#calNext").onclick = () => {
        view.m++;
        if (view.m > 11) {
          view.m = 0;
          view.y++;
        }
        render();
      };
      $("#days").onclick = (e) => {
        const b = e.target.closest("[data-d]");
        if (b) {
          S.date = { y: view.y, m: view.m, d: +b.dataset.d };
          render();
        }
      };
      $("#slots").onclick = (e) => {
        const b = e.target.closest("[data-t]");
        if (b) {
          S.time = b.dataset.t;
          render();
        }
      };
      render();
    </script>
  </body>
</html>
