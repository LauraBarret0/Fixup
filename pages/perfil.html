<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F6F1" />
    <title>FIX UP – Perfil do profissional</title>
    <title>FIX UP – Pedidos</title>
    <link rel="shortcut icon" href="../image/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="screen">
        <header class="head">
          <a
            class="back"
            id="back"
            href="profissionais.html"
            aria-label="Voltar"
            ><svg class="i thick"><use href="#i-back" /></svg
          ></a>
          <div class="t"><h1>Perfil</h1></div>
        </header>
        <div class="body" style="gap: 16px" id="perfilBody"></div>
        <div class="foot split">
          <button
            class="sq"
            id="msgBtn"
            aria-label="Enviar mensagem com fotos e vídeos"
          >
            <svg class="i"><use href="#i-msg" /></svg>
          </button>
          <a
            class="btn primary"
            id="reservar"
            href="pagamento.html"
            style="flex: 1"
          ></a>
        </div>
      </main>
    </div>
    <script src="../js/fixup.js"></script>
    <script>
      const S = FX.state,
        { $ } = FX,
        p = FX.pro(),
        s = FX.svc();
      FX.back(S.mode === "hoje" ? "hoje.html" : "profissionais.html");
      $("#perfilBody").innerHTML = `
  <div class="ph"><div class="avatar lg">${FX.avatar(p, 'lg')}</div><div style="min-width:0"><h2>${p.name}</h2><div class="role">${FX.proRole(p)} · São Paulo, SP</div>
    <div class="tags"><span class="tag mint">${FX.icon("check", "s14 thick")}Identidade</span><span class="tag mint">${FX.icon("check", "s14 thick")}Cursos</span></div></div></div>
  <div class="stats"><div><b>${FX.icon("star", "s16 star")}${FX.rate(p.rating)}</b><span>Avaliação</span></div><div><b>${p.n}</b><span>Serviços</span></div><div><b>${FX.km(p.km)} km</b><span>De você</span></div></div>

    <div class="sec"><div class="sec-t">Portfólio</div><div class="port" style="grid-template-columns:repeat(2,minmax(0,1fr)),minmax(0,1fr))">${FX.photos(p).map((src, i) => `<button class="pf" data-src="${src}" aria-label="Ampliar foto ${i + 1} do portfólio">${FX.icon('camera', 's22')}${s.port[i] || 'Foto'}<img src="${src}" alt="Trabalho de ${p.name}" loading="lazy" onerror="this.remove()"></button>`).join('')}</div></div>


  <div class="sec"><div class="sec-t">Avaliações de clientes</div>${FX.REVIEWS.map((r) => `<div class="review"><header><span>${r.who}</span><span>${FX.icon("star", "s14 star")}${r.r}</span></header><p>${r.t}</p></div>`).join("")}
    <div class="hint center">Dados ilustrativos do protótipo</div></div>`;
      $("#reservar").textContent =
        S.mode === "hoje" ? "Confirmar e pagar" : "Reservar · " + FX.whenText();
        $('#perfilBody').addEventListener('click', (e) => { const b = e.target.closest('.pf'); if (b && b.querySelector('img')) FX.lightbox(b.dataset.src, 'Trabalho de ' + p.name); });
      $("#msgBtn").onclick = () => {
        location.href = "chat.html";
      };
    </script>
  </body>
</html>
